version: 0.2

env:
  variables:
    STAGE: 'dev'
    VITE_GRAPHQL_ENDPOINT: "https://api-dev.meridiomath.org/graphql/graphql"
    VITE_ABE_GQL_ENDPOINT: "https://api-dev.abewriting.org/graphql/graphql"
    VITE_LLM_API_ENDPOINT: "https://api-dev.abewriting.org/docs"
    VITE_REDIRECT_URL: "https://dev.meridiomath.org/"
  parameter-store:
    S3_DEPLOY_BUCKET_DEV: "/mathm/dev/s3-websites/NAME"
    CDN_ID_DEV: "/mathm/dev/CLOUDFRONT_DISTRIBUTION_ID"
    VITE_GOOGLE_CLIENT_ID: "/mathmeridio/shared/google_client_id"
    VITE_COGNITO_DOMAIN: "/mathmeridio/shared/cognito_domain"
    VITE_USER_POOL_ID: "/mathmeridio/shared/user_pool_id"
    VITE_USER_POOL_CLIENT_ID: "/mathmeridio/shared/user_pool_client_id"

phases:
  install:
    runtime-versions:
      nodejs: 24

  build:
    commands:
      - npm run build
      - echo Deploying to $S3_DEPLOY_BUCKET_DEV
      - aws s3 sync ./dist s3://$S3_DEPLOY_BUCKET_DEV/
      - aws cloudfront create-invalidation --distribution-id $CDN_ID_DEV --paths "/*"
